name: deploy

on:
   push:
      branches: [ main ]
   # Pushes made with GITHUB_TOKEN (the weekly data refresh) do not trigger
   # other workflows, so deploy explicitly when the refresh finishes.
   workflow_run:
      workflows: ["Refresh genome dashboard data"]
      types: [completed]
   workflow_dispatch:
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./genome-dashboard

      - name: Deploy
        uses: actions/deploy-pages@v4
